<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17133f">
  <meta name="description" content="교육과 행사에서 사용하는 한글 행운의 랜덤 추첨 프로그램">
  <title>행운의 룰렛 | 랜덤 추첨기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow"><span class="eyebrow-dot"></span> 행운의 추첨</div>
      <h1>행운의 <span>룰렛</span></h1>
      <p>누가 오늘의 행운을 가져갈까요? 참가자를 입력하고 룰렛을 돌려보세요!</p>
    </header>

    <div class="game-grid">
      <section class="panel setup-panel" aria-labelledby="setup-title">
        <div class="panel-heading">
          <span class="step-number">01</span>
          <div>
            <p class="panel-kicker">참가자 설정</p>
            <h2 id="setup-title">누가 참여하나요?</h2>
          </div>
        </div>

        <label class="field-label" for="participant-names">
          참가자 이름
          <span class="participant-chip"><strong id="participant-count">10</strong>명</span>
        </label>
        <textarea id="participant-names" rows="11" spellcheck="false" aria-describedby="names-help">김민준
이서연
박지훈
최하은
정도윤
한유진
오시우
윤채원
강현우
송아린</textarea>
        <p class="field-help" id="names-help">한 줄에 한 명씩 입력해 주세요. 같은 이름은 한 번만 추첨됩니다.</p>

        <label class="field-label" for="winner-count">당첨 인원</label>
        <div class="number-field">
          <input id="winner-count" type="number" min="1" max="10" value="3" inputmode="numeric">
          <span>명</span>
        </div>
      </section>

      <section class="panel draw-panel" aria-labelledby="roulette-title">
        <div class="panel-heading draw-heading">
          <span class="step-number">02</span>
          <div>
            <p class="panel-kicker">행운의 순간</p>
            <h2 id="roulette-title">룰렛을 돌려보세요!</h2>
          </div>
        </div>

        <div class="roulette-wrap" aria-live="polite">
          <div class="roulette-pointer" aria-hidden="true"></div>
          <div class="roulette-orbit orbit-one" aria-hidden="true"></div>
          <div class="roulette-orbit orbit-two" aria-hidden="true"></div>
          <div class="roulette-disc">
            <div class="roulette-spark spark-one" aria-hidden="true">✦</div>
            <div class="roulette-spark spark-two" aria-hidden="true">✧</div>
            <p class="roulette-label">오늘의 행운</p>
            <strong id="roulette-name">준비 완료</strong>
            <span class="roulette-sub">행운의 주인공은?</span>
          </div>
        </div>

        <p id="status-message" class="status-message" role="status">참가자와 당첨 인원을 확인한 뒤 추첨을 시작하세요.</p>

        <div class="action-group">
          <button id="draw-button" class="primary-button" type="button">
            <span aria-hidden="true">✦</span>
            행운의 룰렛 시작
          </button>
          <button id="reset-button" class="secondary-button" type="button">
            <span aria-hidden="true">↻</span>
            결과 초기화
          </button>
        </div>
      </section>

      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="panel-heading">
          <span class="step-number">03</span>
          <div>
            <p class="panel-kicker">당첨 결과</p>
            <h2 id="result-title">축하합니다!</h2>
          </div>
        </div>

        <div class="result-badge" aria-hidden="true">🏆</div>
        <ol id="winner-list" class="winner-list" aria-live="polite"></ol>
        <p class="result-note">당첨자는 추첨 순서대로 표시됩니다.</p>
      </section>
    </div>

    <footer>
      <span>✨</span> 모든 추첨은 브라우저 안에서 무작위로 진행됩니다.
    </footer>
  </main>

  <script src="vendor/canvas-confetti.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
