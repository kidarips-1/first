<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>행운 추첨기 테스트</title>
  <style>
    body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #11152f; color: #f4f6ff; }
    main { max-width: 760px; margin: auto; }
    h1 { color: #9ea9ff; }
    #summary { padding: 16px; border-radius: 12px; background: #20275a; font-weight: 800; }
    li { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #20233c; }
    .pass { color: #7cf6c3; }
    .fail { color: #ff8ca2; }
  </style>
</head>
<body>
  <main>
    <h1>행운 추첨기 자동 테스트</h1>
    <p id="summary" aria-live="polite">테스트 실행 중…</p>
    <ol id="results"></ol>
  </main>
  <script src="app.js"></script>
  <script>
    (function () {
      'use strict';

      var tests = [];
      var results = [];

      function test(name, fn) {
        tests.push({ name: name, fn: fn });
      }

      function equal(actual, expected, message) {
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error(message + ' (실제: ' + JSON.stringify(actual) + ')');
        }
      }

      test('공백 줄과 중복 이름을 제거한다', function () {
        equal(window.LuckyDraw.normalizeNames(' 민준\n\n서연\n민준 \n 지우 '), ['민준', '서연', '지우'], '정규화 결과가 다릅니다');
      });

      test('당첨 인원은 1명 이상이어야 한다', function () {
        equal(window.LuckyDraw.validateDrawCount(0, 3).valid, false, '0명을 허용하면 안 됩니다');
      });

      test('당첨 인원은 후보 수를 넘을 수 없다', function () {
        equal(window.LuckyDraw.validateDrawCount(4, 3).valid, false, '후보 수 초과를 허용하면 안 됩니다');
      });

      test('유효한 당첨 인원을 허용한다', function () {
        equal(window.LuckyDraw.validateDrawCount(2, 3), { valid: true, message: '' }, '유효한 인원 검증이 틀립니다');
      });

      test('고정 난수로도 중복 없는 당첨자를 뽑는다', function () {
        var sequence = [1, 1, 0];
        var cursor = 0;
        var result = window.LuckyDraw.pickUnique(['가', '나', '다', '라'], 3, function (length) {
          var value = sequence[cursor++];
          return value % length;
        });
        equal(result.winners, ['나', '다', '가'], '당첨 순서가 다릅니다');
        equal(result.remaining, ['라'], '남은 후보가 다릅니다');
      });

      test('초기 상태에는 당첨자와 진행 상태가 없다', function () {
        equal(window.LuckyDraw.createInitialState(), { winners: [], remaining: [], isDrawing: false }, '초기 상태가 다릅니다');
      });

      function createFixture(names, count) {
        var root = document.createElement('div');
        root.innerHTML = '<textarea></textarea><input type="number"><button class="start"></button><button class="reset"></button><div class="roulette"></div><p class="status"></p><ol class="winners"></ol><span class="count"></span>';
        var elements = {
          namesInput: root.querySelector('textarea'),
          drawCountInput: root.querySelector('input'),
          startButton: root.querySelector('.start'),
          resetButton: root.querySelector('.reset'),
          rouletteName: root.querySelector('.roulette'),
          statusMessage: root.querySelector('.status'),
          resultsList: root.querySelector('.winners'),
          participantCount: root.querySelector('.count')
        };
        elements.namesInput.value = names;
        elements.drawCountInput.value = count;
        return elements;
      }

      test('빈 명단은 추첨하지 않고 안내한다', async function () {
        var elements = createFixture('', 1);
        var controller = window.LuckyDraw.createController(elements, {});
        var started = await controller.start();
        equal(started, false, '빈 명단 추첨을 시작하면 안 됩니다');
        equal(elements.statusMessage.textContent, '참가자 이름을 한 명 이상 입력해 주세요.', '빈 명단 안내가 다릅니다');
      });

      test('후보보다 많은 당첨 인원은 추첨하지 않는다', async function () {
        var elements = createFixture('가\n나', 3);
        var controller = window.LuckyDraw.createController(elements, {});
        var started = await controller.start();
        equal(started, false, '인원 초과 추첨을 시작하면 안 됩니다');
        equal(elements.statusMessage.textContent.includes('참가자 수'), true, '인원 초과 원인이 안내되지 않았습니다');
      });

      test('여러 당첨자를 중복 없이 순서대로 발표한다', async function () {
        var elements = createFixture('가\n나\n다', 2);
        var picks = [0, 0];
        var controller = window.LuckyDraw.createController(elements, {
          randomIndex: function () { return picks.shift(); },
          animateWinner: function (winner) {
            elements.rouletteName.textContent = winner;
            return Promise.resolve();
          },
          celebrate: function () {}
        });
        var started = await controller.start();
        equal(started, true, '유효한 추첨이 시작되지 않았습니다');
        equal(controller.getState().winners, ['가', '나'], '당첨자가 중복 없이 선택되지 않았습니다');
        equal(Array.from(elements.resultsList.children).map(function (item) { return item.textContent; }), ['가', '나'], '결과 목록이 다릅니다');
      });

      test('초기화 전 재추첨은 이전 당첨자를 제외한다', async function () {
        var elements = createFixture('가\n나\n다', 2);
        var controller = window.LuckyDraw.createController(elements, {
          randomIndex: function () { return 0; },
          animateWinner: function () { return Promise.resolve(); },
          celebrate: function () {}
        });

        await controller.start();
        var secondStarted = await controller.start();
        equal(secondStarted, false, '남은 후보보다 많은 인원으로 재추첨하면 안 됩니다');
        equal(controller.getState().winners, ['가', '나'], '이전 당첨 결과가 유지되지 않았습니다');

        elements.drawCountInput.value = 1;
        await controller.start();
        equal(controller.getState().winners, ['가', '나', '다'], '재추첨에서 이전 당첨자가 제외되지 않았습니다');
        equal(new Set(controller.getState().winners).size, 3, '재추첨 결과에 중복 당첨자가 있습니다');
        equal(elements.resultsList.children.length, 3, '재추첨 결과가 목록에 누적되지 않았습니다');
      });

      test('초기화는 결과를 지우고 입력 명단은 유지한다', async function () {
        var elements = createFixture('가\n나', 1);
        var controller = window.LuckyDraw.createController(elements, {
          randomIndex: function () { return 0; },
          animateWinner: function () { return Promise.resolve(); },
          celebrate: function () {}
        });
        await controller.start();
        controller.reset();
        equal(controller.getState(), { winners: [], remaining: [], isDrawing: false }, '상태가 초기화되지 않았습니다');
        equal(elements.resultsList.children.length, 0, '결과 목록이 지워지지 않았습니다');
        equal(elements.namesInput.value, '가\n나', '입력 명단이 유지되지 않았습니다');
        equal(elements.rouletteName.textContent, '준비 완료', '초기화 안내가 한글로 표시되지 않았습니다');
      });

      test('폭죽 라이브러리가 없어도 안전하게 계속된다', function () {
        equal(window.LuckyDraw.safeCelebrate(undefined), false, '라이브러리 부재를 안전하게 처리하지 못했습니다');
      });

      test('폭죽 라이브러리 오류가 추첨을 중단하지 않는다', function () {
        var result = window.LuckyDraw.safeCelebrate(function () { throw new Error('폭죽 오류'); });
        equal(result, false, '폭죽 오류를 안전하게 처리하지 못했습니다');
      });

      (async function run() {
        for (var i = 0; i < tests.length; i += 1) {
          try {
            await tests[i].fn();
            results.push({ name: tests[i].name, pass: true });
          } catch (error) {
            results.push({ name: tests[i].name, pass: false, message: error.message });
          }
        }

        var list = document.getElementById('results');
        results.forEach(function (result) {
          var item = document.createElement('li');
          item.className = result.pass ? 'pass' : 'fail';
          item.textContent = (result.pass ? '통과: ' : '실패: ') + result.name + (result.message ? ' — ' + result.message : '');
          list.appendChild(item);
        });
        var passed = results.filter(function (result) { return result.pass; }).length;
        document.getElementById('summary').textContent = passed + '/' + results.length + ' 테스트 통과';
        document.body.dataset.testsPassed = String(passed);
        document.body.dataset.testsTotal = String(results.length);
      }());
    }());
  </script>
</body>
</html>
